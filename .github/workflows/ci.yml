name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # prepare スクリプトで packages/livesync-workers の build も走る
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check script syntax
        run: |
          node --check scripts/setup.mjs
          node --check scripts/prepare-rollback.mjs
          for script in test/e2e/*.mjs; do node --check "$script"; done

      - name: Check changed whitespace (no formatter configured)
        run: git diff --check origin/main...HEAD

      - run: pnpm typecheck

      - run: pnpm test

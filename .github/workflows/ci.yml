name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The prepare script also builds packages/livesync-workers.
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check script syntax
        run: |
          node --check scripts/setup.mjs
          node --check scripts/prepare-rollback.mjs
          for script in test/e2e/*.mjs; do node --check "$script"; done

      - name: Check changed whitespace (no formatter configured)
        run: git diff --check origin/main...HEAD

      - run: pnpm typecheck

      - run: pnpm test

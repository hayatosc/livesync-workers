name: Publish to npm

# Publishes packages/livesync-workers when a GitHub Release is published.
# Uses npm trusted publishing (OIDC): configure the trusted publisher on
# npmjs.com (repository hayatosc/livesync-workers, workflow publish.yml) first.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # prepare スクリプトで packages/livesync-workers の build も走る
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Check that the release tag matches the package version
        run: |
          version="$(node -p "require('./packages/livesync-workers/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }

      # npm CLI handles trusted publishing; the package has no workspace: dependencies.
      - run: npm publish --provenance --access public
        working-directory: packages/livesync-workers

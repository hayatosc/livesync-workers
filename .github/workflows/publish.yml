name: Publish to npm

# Publishes packages/livesync-workers when a GitHub Release is published.
# Uses npm trusted publishing (OIDC): configure the trusted publisher on
# npmjs.com (repository hayatosc/livesync-workers, workflow publish.yml) first.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail fast, before installing anything, when the tag and version disagree.
      - name: Check that the release tag matches the package version
        run: |
          version="$(node -p "require('./packages/livesync-workers/package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: this job holds an OIDC token that can publish, so it
      # must not restore a cache that pull request runs could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # The prepare script also builds packages/livesync-workers.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # npm CLI handles trusted publishing; the package has no workspace: dependencies.
      - run: npm publish --provenance --access public
        working-directory: packages/livesync-workers
